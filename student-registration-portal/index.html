<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration & Result Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Registration & Result Portal</h1>
  </header>

  <main>
    <section class="card">
      <h2>Register a Student</h2>
      <form id="registrationForm" novalidate>
        <label for="name">Name</label>
        <input type="text" id="name">

        <label for="roll">Roll No</label>
        <input type="text" id="roll">

        <label for="course">Course</label>
        <input type="text" id="course">

        <h3 style="margin-top:20px">Subjects</h3>
        <div id="subjectsContainer"></div>
        <button type="button" id="addSubject" class="secondary">+ Add Subject</button>

        <p id="formError" class="error" role="alert"></p>
        <button type="submit">Submit</button>
      </form>
    </section>

    <section id="resultSection" class="card hidden">
      <h2>Result</h2>
      <div id="result"></div>
    </section>

    <section class="card">
      <h2>Registered Students</h2>
      <p id="emptyMessage" class="empty">No students registered yet.</p>
      <div class="table-wrap">
        <table id="studentsTable" class="hidden">
          <thead>
            <tr><th>Roll No</th><th>Name</th><th>Course</th><th>Percentage</th><th>Grade</th><th>Result</th><th></th></tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
