<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Event Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>College Event Portal</h1>
    <nav>
      <a href="#events">Events</a>
      <a href="#addEvent">Add Event</a>
      <a href="#registration">Register</a>
      <a href="#registrations">Registrations</a>
    </nav>
  </header>

  <main>
    <section id="events">
      <h2>Events</h2>
      <p id="emptyEvents" class="empty">No events yet. Add one in the "Add Event" section below.</p>
      <div id="eventList" class="event-grid"></div>
    </section>

    <section id="addEvent" class="card" style="margin-top:20px">
      <h2>Add Event (for organisers)</h2>
      <form id="addEventForm" novalidate>
        <label for="newEventName">Event Name</label>
        <input type="text" id="newEventName">
        <label for="eventDate">Date</label>
        <input type="date" id="eventDate">
        <label for="eventVenue">Venue</label>
        <input type="text" id="eventVenue">
        <p id="addEventError" class="error" role="alert"></p>
        <button type="submit">Add Event</button>
      </form>
    </section>

    <section id="registration" class="card">
      <h2>Register for an Event</h2>
      <form id="eventForm" novalidate>
        <label for="participant">Your Name</label>
        <input type="text" id="participant">
        <label for="email">Your Email</label>
        <input type="email" id="email">
        <label for="eventSelect">Event</label>
        <select id="eventSelect"></select>
        <p id="registerError" class="error" role="alert"></p>
        <button type="submit">Register</button>
      </form>
      <div id="confirmation" role="status"></div>
    </section>

    <section id="registrations" class="card">
      <h2>Registrations</h2>
      <p id="emptyRegs" class="empty">No registrations yet.</p>
      <div class="table-wrap">
        <table id="regTable" class="hidden">
          <thead><tr><th>Name</th><th>Email</th><th>Event</th><th></th></tr></thead>
          <tbody id="regBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
